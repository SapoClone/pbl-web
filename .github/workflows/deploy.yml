name: Deploy to S3
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.mts'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write # required for OIDC auth to AWS (no long-lived access keys)

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn vitest run
      # `build` type-checks first (tsc && vite build). The API URL is baked into the bundle at build time.
      - run: yarn build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets never change under their name, so browsers keep them for a year. Old ones stay in the bucket,
      # so a tab opened before the deploy can still load the chunks it asks for.
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://${{ vars.WEB_BUCKET }}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # Everything else (index.html above all) is revalidated on every load, so a deploy shows up at once.
      - name: Upload index.html and public files
        run: |
          aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" \
            --exclude "assets/*" --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}" --id "$id"
